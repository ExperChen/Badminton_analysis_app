<!doctype html><html lang="zh-CN"><head><script src="/static/account-context.js"></script><script src="/static/ui-language.js?v=20261009-zh"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地账号 · 羽球分析</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/accounts.css"><script defer src="/static/accounts-login.js?v=20261013-registration"></script></head><body class="account-login"><main class="account-card"><p class="eyebrow">羽球分析</p><h1 id="heading">登录本地账号</h1><p id="intro">使用本系统邮箱和密码登录，或自行注册普通账号。</p><div class="toolbar" id="modes"><button data-mode="login">登录</button><button data-mode="register" hidden>注册账号</button><button data-mode="reset">激活账号 / 重置密码</button></div><form id="auth-form"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required maxlength="254"><label for="reset-token" id="reset-label" hidden>管理员提供的激活码或重置码</label><input id="reset-token" hidden autocomplete="off" maxlength="200"><label for="password">本系统密码</label><input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"><label for="confirm-password" id="confirm-label" hidden>确认密码</label><input id="confirm-password" type="password" autocomplete="new-password" hidden minlength="12" maxlength="128"><button class="primary" id="submit">登录</button></form><p id="message" role="status"></p><p class="hint">每个登录窗口独立，可在同一浏览器同时登录多个本地账号。比赛数据和分析额度均按账号独立管理。</p></main></body></html>
