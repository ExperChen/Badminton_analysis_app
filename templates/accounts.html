<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号与管理 · 羽序</title><link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/accounts.css">
<script src="/static/account-context.js"></script><script src="/static/ui-language.js"></script><script src="/static/account-session.js"></script><script defer src="/static/accounts.js?v=20261025-local"></script>
</head><body class="account-body"><main class="account-page">
<header class="account-header"><div><p class="eyebrow">账号与数据</p><h1>账号与管理</h1><p id="identity">正在读取…</p></div><div class="toolbar"><a class="button" href="/library">视频空间</a><a class="button" href="/tracker">比赛项目</a><a href="/login?new=1" target="_blank" rel="noopener">登录其他账号</a><button id="logout">退出此账号</button></div></header>
<p id="message" role="status" class="account-message" hidden></p><p id="upload-capacity" class="hint"></p>
<p class="hint">视频和比赛按账号归属隔离。管理员可管理全部账号与数据。</p>
<div id="admin" hidden>
<section class="account-section"><h2>子账号管理</h2><form id="create-user" class="toolbar"><label>邮箱 <input id="new-user-email" type="email" required maxlength="254"></label><button type="submit">创建子账号</button></form><p class="hint">用户也可自行注册；管理员代建后需将一次性激活码私下交给本人。</p><div id="users"></div></section>
<section class="account-section"><div class="section-top"><h2>账号视频库</h2><button id="refresh-uploads">刷新视频</button></div><p id="upload-total"></p><div id="upload-groups"></div></section>
<section class="account-section"><div class="section-top"><h2>历史数据认领</h2><button id="refresh">刷新列表</button></div><p class="hint">仅可认领尚无所有者的资源；不会按标题推断归属。</p><label>认领依据 <input id="reason" maxlength="500" placeholder="核对原片和比赛记录后填写"></label><div id="unassigned"></div></section>
<section class="account-section"><h2>操作记录</h2><div id="audit"></div></section>
<section class="account-section"><h2>后台日志</h2><button id="refresh-logs">刷新日志</button><pre id="backend-logs"></pre></section>
</div></main></body></html>
